# 把這個檔案放到 profile repo 的 .github/workflows/snake.yml
# 產生一隻在 contribution 格子上爬、把綠格子吃掉的毛毛蟲動畫

name: Generate Caterpillar

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00（台灣早上 8 點）更新一次
  workflow_dispatch:       # 可以在 Actions 頁面手動執行
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate caterpillar SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/caterpillar.svg?color_snake=#7cb342
            dist/caterpillar-dark.svg?palette=github-dark&color_snake=#9ccc65

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
